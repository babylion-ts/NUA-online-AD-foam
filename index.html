<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Image Consulting · 무료 후기 이벤트</title>
<meta name="description" content="이미지 컨설팅 무료 후기 이벤트 신청">
<meta property="og:type" content="website">
<meta property="og:title" content="Image Consulting · 무료 후기 이벤트">
<meta property="og:image" content="pages/p-1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root { --font: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', sans-serif; --accent: #f1541f; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #201d1a; color: #f3f1ec; font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }

  .app { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }

  /* 화면 = PDF 원본 페이지 비율(1080:1800) 그대로 */
  .stage {
    position: relative;
    --sw: min(100vw, 460px, calc(100dvh * 0.6));   /* 화면 폭 — 글자·모서리 크기를 이 폭에 비례시킴 */
    width: var(--sw);
    aspect-ratio: 1080 / 1800;
    overflow: hidden;
    background: #201d1a;
  }
  .page { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; display: block; }
  .layer { position: absolute; inset: 0; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* 스모어식 전환용 조각 — 원본 페이지를 마스크(m-*.png)로 오려 요소별로 띄움. 멈춰 있을 땐 원본과 똑같이 보임 */
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .piece { position: absolute; overflow: hidden; transform-origin: 50% 50%; will-change: transform, opacity; }
  .pc-in { position: absolute; background-size: 100% 100%; background-repeat: no-repeat;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .fx .field.fake { display: flex; align-items: center; justify-content: center; padding: 0 calc(var(--sw) * .04); white-space: nowrap; overflow: hidden; }
  .fx .field.fake.left { justify-content: flex-start; padding: 0 calc(var(--sw) * .06); }

  /* 투명 탭 영역 */
  .hot { position: absolute; border: 0; background: transparent; padding: 0; margin: 0; cursor: pointer; border-radius: 0; }

  /* 스모어 0~10 숫자 버튼 (smore.im/form/qrjbVhbbeC 4번 문항, FormScalePC) — 스모어 CSS 값 그대로.
     스모어 px(버튼 44·간격 6 → 한 줄 544px)을 --u로 비례시켜 한 줄이 화면 폭의 96.6%(원본 숫자 줄 폭)가 되게 함.
     색은 그 폼 테마: 테두리·선택 배경 = 흰색 76%, 숫자·라벨 = 흰색, 선택된 숫자 = 검정 */
  .scale-pc { --u: calc(var(--sw) * .966 / 544); --key: rgba(255,255,255,.76); --key-rgb: 255,255,255; --key-text: #000; --text: #fff;
    position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: calc(var(--u) * 20); font-family: var(--font); }
  .scale-pc .nums { position: relative; gap: calc(var(--u) * 6); display: flex; flex-direction: row; justify-content: space-between; align-items: center; }
  .snum { display: flex; flex-direction: row; justify-content: center; align-items: center; cursor: pointer; padding: calc(var(--u) * 10);
    height: calc(var(--u) * 44); width: calc(var(--u) * 44); border: calc(var(--u) * 2) solid var(--key); border-radius: calc(var(--u) * 18);
    transition: transform .3s ease, background-color .3s ease, color .3s ease; flex: none; color: var(--text);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: calc(var(--u) * 20); line-height: 1; user-select: none; -webkit-user-select: none; }
  @media (hover: hover) { .snum:hover { transform: translateY(calc(var(--u) * -2)) scale(1.05); background-color: rgba(var(--key-rgb), .2); } }
  .snum.selected, .snum.selected:hover { transform: translateY(calc(var(--u) * -3)) scale(1.1); color: var(--key-text); background-color: var(--key); }
  .scale-pc .labels { display: flex; flex-direction: row; justify-content: space-between; align-items: center; color: var(--text); width: 100%;
    font-size: calc(var(--u) * 16); line-height: calc(var(--u) * 20); }
  .scale-pc .labels span { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; flex: 1; }
  .scale-pc .labels .l { text-align: left; }
  .scale-pc .labels .r { text-align: right; }

  /* 스모어 '다음' 버튼 (Button · 버튼 테마 2) — 스모어 CSS 값 그대로, px는 폰 폭 390px 기준으로 --u 비례.
     색은 레퍼런스 폼(letteRing) 테마: 배경 흰색 76% + 같은 색 그림자, 글자 검정, 아이콘 chevron_right */
  .smore-btn { --u: calc(var(--sw) / 390); position: absolute; left: calc(50% - var(--u) * 75); top: calc(87% - var(--u) * 27);
    width: calc(var(--u) * 150); height: calc(var(--u) * 54); padding: calc(var(--u) * 3) calc(var(--u) * 6); margin: 0;
    display: flex; justify-content: center; align-items: center; border: 0; border-radius: calc(var(--u) * 12);
    background: rgba(255,255,255,.76); box-shadow: 0 calc(var(--u) * 5) calc(var(--u) * 20) rgba(255,255,255,.34); color: #000;
    font-family: var(--font); cursor: pointer; transition: transform .2s ease-in-out, background-color .2s ease, opacity .2s ease;
    -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .smore-btn svg { width: calc(var(--u) * 24); height: calc(var(--u) * 24); margin-right: calc(var(--u) * 10); flex: none; }
  .smore-btn span { font-size: calc(var(--u) * 16); font-weight: 500; line-height: calc(var(--u) * 24); padding: calc(var(--u) * 6); letter-spacing: -.5px; }
  .smore-btn.disabled { opacity: .5; cursor: not-allowed; }
  @media (hover: hover) { .smore-btn:not(.disabled):hover { transform: translateY(-4px); } }
  /* 선택지 버튼도 미니멀하게 — 글씨 13px·보통 굵기, 모서리 10px, 그림자 옅게 */
  .smore-btn.choice { padding: 0 calc(var(--u) * 12); border-radius: calc(var(--u) * 10); box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 12) rgba(255,255,255,.18); }
  .smore-btn.choice span { font-size: calc(var(--u) * 13); font-weight: 400; padding: 0; line-height: 1.2; letter-spacing: -.3px; }
  /* '다음'은 미니멀하게 작게(96×36px@390) — 원래 이미지 속 '다음' 자리(중심 y 86%)에 */
  .smore-btn.next { left: calc(50% - var(--u) * 48); top: calc(86% - var(--u) * 18); width: calc(var(--u) * 96); height: calc(var(--u) * 36);
    padding: 0; border-radius: calc(var(--u) * 10); box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(255,255,255,.18); }
  .smore-btn.next svg { width: calc(var(--u) * 16); height: calc(var(--u) * 16); margin-right: calc(var(--u) * 3); }
  .smore-btn.next span { font-size: calc(var(--u) * 13.5); padding: 0; line-height: 1; letter-spacing: -.3px; }

  /* 추구 이미지 이름(청순·댄디…) — 이름 스타일 시안 7: Pretendard 10.5px, 살짝 흐린 흰색, 사진 아래 10px(폰 390px 기준) */
  .plabel { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; line-height: 1; pointer-events: none;
    font-family: 'Pretendard', var(--font); font-weight: 400; font-size: calc(var(--sw) * 10.5 / 390); color: rgba(243,241,236,.72); }

  /* 프로세스 페이지(시안 2-2, 세로 타임라인) — HTML로 구성. 좌표·크기는 폰 폭 390px(화면 높이 650px) 기준 px × --u */
  .blk { --u: calc(var(--sw) / 390); position: absolute; color: #f4f1ec; }
  .blk .pz-title { font-family: 'Pretendard', var(--font); font-weight: 700; font-size: calc(var(--u) * 23); line-height: 1.2; letter-spacing: -.01em; }
  .blk .pz-h { font-family: 'Pretendard', var(--font); font-weight: 500; font-size: calc(var(--u) * 16); line-height: 1.2; }
  .blk .pz-k { font-family: 'Gowun Dodum', var(--font); font-size: calc(var(--u) * 10.5); line-height: 1.2; margin-top: calc(var(--u) * 1.5); color: rgba(244,241,236,.72); }
  .blk .pz-ph { position: absolute; display: block; object-fit: cover; }
  .blk .pz-line { position: absolute; width: 1px; background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0)); }
  .blk .pz-dot { position: absolute; width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: 50%; border: 1.5px solid #f4f1ec; background: rgba(0,0,0,.2); box-sizing: border-box; }
  .blk .pz-chip { position: absolute; right: 0; top: 0; white-space: nowrap; font-family: 'Pretendard', var(--font); font-weight: 500; font-size: calc(var(--u) * 10.5);
    padding: calc(var(--u) * 5) calc(var(--u) * 10); border-radius: 999px; border: 1px solid rgba(255,255,255,.45); color: rgba(255,255,255,.85); }

  /* 원본 입력칸 위에 얹는 실제 입력창 */
  .field {
    position: absolute; border: 0; background: transparent;
    font-family: var(--font); outline: none; padding: 0 4%;
    text-align: center; line-height: 1;
  }
  .field.left { text-align: left; padding: 0 6%; }
  /* 스모어 입력칸(TextInput, 어두운 테마) — 시안 A2: 폭 68%, 높이 40px, 모서리 10px, 글씨 14px(폰 390px 기준) */
  .field.glass { --u: calc(var(--sw) / 390); text-align: left; padding: 0 calc(var(--u) * 12); color: #fff; font-size: calc(var(--u) * 14);
    border: 1px solid rgba(255,255,255,.63); background: rgba(255,255,255,.22); border-radius: calc(var(--u) * 10);
    -webkit-backdrop-filter: blur(10px) brightness(110%) contrast(110%) saturate(110%); backdrop-filter: blur(10px) brightness(110%) contrast(110%) saturate(110%);
    box-shadow: 0 2px 10px 3px rgba(0,0,0,.032); caret-color: #fff;
    transition: border-color .3s ease, background-color .4s ease, box-shadow .3s ease; }
  .field.glass::placeholder { color: rgba(255,255,255,.6); }
  .field.glass:focus { border-color: rgba(255,255,255,.9); background: rgba(255,255,255,.3); box-shadow: 0 2px 10px 5px rgba(0,0,0,.032); }
  .fx .field.glass.fake { display: flex; align-items: center; justify-content: flex-start; padding: 0 calc(var(--u) * 12); white-space: nowrap; overflow: hidden; }
  .fx .field.glass.fake.empty { color: rgba(255,255,255,.6); }

  /* 디버그(?edit=1): 탭 영역 표시 */
  .edit .hot { background: rgba(241,84,31,.3); box-shadow: inset 0 0 0 1px #f1541f; }
  .edit .field { background: rgba(0,130,255,.35) !important; }

  /* 뒤로가기 */
  .back { position: absolute; top: 2%; left: 3%; z-index: 6; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(0,0,0,.16); color: #fff; display: none; place-items: center; cursor: pointer; opacity: .65; }
  .back svg { width: 20px; height: 20px; }
  .back.show { display: grid; }

  /* 완료 / 제출 중 */
  .cover { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 10%;
    background: radial-gradient(130% 100% at 60% 5%, #4a453f, #262019 68%, #17130f); }
  .cover.show { display: flex; }
  .tick { width: 66px; height: 66px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; }
  .tick svg { width: 30px; height: 30px; color: var(--accent); }
  .cover h2 { font-size: 26px; font-weight: 800; }
  .cover p { font-size: 15px; line-height: 1.75; color: rgba(243,241,236,.72); }
  /* 제출 중(시안 1): 폼과 같은 블러 배경 위에 살짝 어둡게 + 흰 점 */
  #loading { background: linear-gradient(rgba(25,22,19,.5), rgba(25,22,19,.5)), url(pages/bg.jpg) center/cover, #201d1a; }
  /* 완료 화면(시안 4-8): 배경 = done-48.jpg(원래 사진을 위에 크게, 아래는 같은 사진을 흐리게 이어 붙임)
     그 위에 흰 테두리 '신청 완료' 배지 → 감사합니다 → 짧은 선 → '추후 유선으로 안내드립니다 :)'. 줄 위치는 배지 중심(y 58.5%)에서 폰 390px 기준 px만큼 아래 */
  #done { display: none; padding: 0; background: #201d1a; }
  #done.show { display: block; }
  .done-text { --u: calc(var(--sw) / 390); position: absolute; inset: 0; z-index: 2; pointer-events: none; font-family: var(--font); }
  .done-text > * { position: absolute; left: 0; right: 0; margin: 0 auto; text-align: center; white-space: nowrap; line-height: 1;
    transform: translateY(-50%); top: calc(58.5% + var(--u) * var(--dy)); }
  .done-text .badge { width: max-content; padding: calc(var(--u) * 5.5) calc(var(--u) * 12); border: 1.5px solid rgba(255,255,255,.67); border-radius: 999px;
    font-size: calc(var(--u) * 11); font-weight: 500; color: rgba(255,255,255,.9); }
  .done-text .title { font-size: calc(var(--u) * 21); font-family: 'SUIT', var(--font); font-weight: 600; color: #f5f2ec; }   /* 글씨체 시안 12: SUIT 세미볼드 */
  .done-text .rule { width: calc(var(--u) * 22); height: calc(var(--u) * 2.8); border-radius: 2px; background: rgba(255,255,255,.47); }
  .done-text .msg { font-size: calc(var(--u) * 14); font-family: 'Gowun Dodum', var(--font); font-weight: 400; color: #f5f2ec; }   /* 글씨체 시안 4: 고운돋움 */
  /* 인스타그램 링크(시안 16): '@nua.look' 아래 '👆 눌러서 인스타그램 보기' — 안내 줄은 천천히 깜빡이고 손가락은 톡톡 두드리듯 움직임 */
  .done-text .handle { top: auto; bottom: calc(var(--u) * 20); transform: none; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 6);
    font-size: calc(var(--u) * 12); font-weight: 400; letter-spacing: .04em; color: rgba(255,255,255,.75);
    width: max-content; padding: calc(var(--u) * 6) calc(var(--u) * 12); text-decoration: none; pointer-events: auto; }
  .done-text .handle .hint { font-size: calc(var(--u) * 10.5); letter-spacing: .02em; color: rgba(255,255,255,.55); animation: hintBlink 1.8s ease-in-out infinite; }
  .done-text .handle .tap { display: inline-block; margin-right: calc(var(--u) * 3); transform-origin: 50% 90%; animation: fingerTap 1.8s ease-in-out infinite; }
  @keyframes hintBlink { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes fingerTap { 0%, 55%, 100% { transform: translateY(0) scale(1); } 65% { transform: translateY(calc(var(--u) * -4)) scale(1.05); } 75% { transform: translateY(0) scale(.92); } 85% { transform: translateY(calc(var(--u) * -2)); } }
  @media (prefers-reduced-motion: reduce) { .done-text .handle .hint, .done-text .handle .tap { animation: none; } }
  .dots { display: flex; gap: 9px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: #f3f1ec; animation: pulse 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%,80%,100% { transform: scale(.4); opacity: .3; } 40% { transform: scale(1); opacity: 1; } }
  .dots + p { font-size: 15px; color: rgba(243,241,236,.7); }

  /* 개인정보 동의 (마지막 페이지, 다음 버튼 아래) */
  .consent { position: absolute; left: 6%; width: 88%; top: 90.7%; display: flex; align-items: center; justify-content: center; gap: 6px; color: #f3f1ec; font-size: clamp(8.5px, 2.7vw, 11px); }
  .consent .box { flex: none; width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid rgba(255,255,255,.55); background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .consent .box svg { width: 9px; height: 9px; color: #fff; opacity: 0; }
  .consent .box.on { background: #16130f; border-color: #16130f; }
  .consent .box.on svg { opacity: 1; }
  .consent.warn .box { border-color: var(--accent); animation: shake .32s; }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  .consent label { cursor: pointer; line-height: 1.35; word-break: keep-all; }
  .consent .policy-link { font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  /* 개인정보처리방침 팝업 */
  .modal { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 22px; background: rgba(0,0,0,.62); }
  .modal.show { display: flex; }
  .modal .card { width: 100%; max-width: 400px; max-height: 82vh; display: flex; flex-direction: column; background: #f4f2ee; color: #2a2724; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .modal .card h3 { font-size: 16px; font-weight: 800; padding: 20px 20px 12px; flex: none; }
  .modal .card .body { padding: 0 20px 4px; overflow-y: auto; font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: #3b362f; -webkit-overflow-scrolling: touch; }
  .modal .card .close { flex: none; margin: 14px 20px 18px; min-height: 46px; border: 0; border-radius: 9px; background: #1f1c18; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { .consent.warn .box { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <button class="back" id="back" type="button" aria-label="이전">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <img class="page" id="plate" src="pages/bg.jpg" alt="" style="opacity:0">
    <div id="screen"></div>
    <div class="cover" id="loading"><div class="dots"><i></i><i></i><i></i></div><p>제출 중</p></div>
    <div class="cover" id="done">
      <img class="page" src="pages/done-48.jpg" alt="신청 완료">
      <div class="done-text">
        <div class="badge" style="--dy:0">신청 완료</div>
        <div class="title" style="--dy:32">감사합니다</div>
        <div class="rule" style="--dy:64"></div>
        <div class="msg" style="--dy:98">추후 유선으로 안내드립니다 :)</div>
        <a class="handle" href="https://www.instagram.com/nua.look/" target="_blank" rel="noopener"><span>@nua.look</span><span class="hint"><span class="tap">👆</span>눌러서 인스타그램 보기</span></a>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card" role="dialog" aria-modal="true" aria-label="개인정보 수집 및 이용 동의">
    <h3>개인정보 수집 및 이용 동의</h3>
    <div class="body" id="policyBody"></div>
    <button class="close" type="button" id="policyClose">확인</button>
  </div>
</div>

<script>
/* =========================================================
   설정 — 응답을 구글 시트로 받으려면 SCRIPT_URL 연결
   ========================================================= */
const CONFIG = { SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyeBHRAYjMFcgtU3xP1PNWtO2AZH27C-klJ8YFAHE2sJQZD66VTD95XWfcfwNU11-B8/exec', FORM_ID: 'image-consulting-event', LOADING_MS: 800 };

const T0 = Date.now();
const SID_KEY = 'ic_form_sid';
const newId = () => { try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {} return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
const SID = (() => { try { let v = sessionStorage.getItem(SID_KEY); if (!v) { v = newId(); sessionStorage.setItem(SID_KEY, v); } return v; } catch (e) { return newId(); } })();
const params = new URLSearchParams(location.search);
const state = { i: 0, answers: {}, seq: 0, busy: false, submitted: false, consent: false };

/* 개인정보 수집 및 이용 동의 안내문 */
const POLICY = `NUA는 이미지 컨설팅 체험단 이벤트 진행을 위하여 아래와 같이 개인정보를 수집·이용합니다.

1. 수집·이용 목적
• 이벤트 참가 접수 및 본인 확인
• 무드 리딩 프로그램 진행 및 결과 안내
• 무드 스타일링 관련 안내 연락

2. 수집하는 개인정보 항목
이름, 전화번호, 주소

3. 보유 및 이용 기간
이벤트 종료 및 경품 발송 완료 후 3개월 이내 파기`;

function track(event, extra = {}) {
  const s = STEPS[state.i] || {};
  const p = { form: CONFIG.FORM_ID, sid: SID, seq: ++state.seq, event, step: s.id, ts: new Date().toISOString(), elapsed: Math.round((Date.now() - T0) / 1000), ...extra };
  console.log('[track]', p);
  if (CONFIG.SCRIPT_URL) {
    const body = JSON.stringify(p);
    // Apps Script는 fetch(POST)로 확실히 doPost가 실행됨. keepalive라 화면 이탈 시에도 전송됨.
    try {
      fetch(CONFIG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body });
    } catch (e) {
      try { navigator.sendBeacon(CONFIG.SCRIPT_URL, new Blob([body], { type: 'text/plain;charset=UTF-8' })); } catch (e2) {}
    }
  }
}

/* =========================================================
   렌더링
   ========================================================= */
const $screen = document.getElementById('screen');
const $back = document.getElementById('back');
const $loading = document.getElementById('loading');
const $done = document.getElementById('done');
const EDIT = params.has('edit');
if (EDIT) document.body.classList.add('edit');

const imgOf = s => s.imgBy ? s.imgBy(state.answers) : s.img;
const zonesOf = s => s.zonesBy ? s.zonesBy(state.answers) : s.zones;
const css = r => `left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%`;

function render() {
  const s = STEPS[state.i];
  const layer = document.createElement('div');
  layer.className = 'layer';
  const im = document.createElement('img');
  im.className = 'page'; im.src = imgOf(s); im.alt = '';
  layer.appendChild(im);

  zonesOf(s).forEach((z, idx) => {
    if (z.kind === 'field') {
      const inp = document.createElement('input');
      inp.className = 'field' + (z.glass ? ' glass' : '') + (z.align === 'left' ? ' left' : '');
      inp.dataset.col = z.col;
      inp.type = z.type || 'text';
      if (z.mode) inp.inputMode = z.mode;
      if (z.format) inp.dataset.format = z.format;
      inp.value = state.answers[z.col] || '';
      if (z.glass) { inp.placeholder = z.ph || ''; inp.style.cssText = css(z.rect); }
      else {
        inp.dataset.fill = z.fill;
        inp.style.cssText = css(z.rect) + `;color:${z.ink};font-size:clamp(13px,4.4vw,20px)`;
        if (inp.value) inp.style.background = z.fill;
      }
      layer.appendChild(inp);
    } else if (z.smore) {
      layer.appendChild(smoreBtn(z, idx));
    } else {
      const b = document.createElement('button');
      b.className = 'hot' + (z.round ? ' round' : ''); b.type = 'button';
      b.style.cssText = css(z.rect); b.dataset.idx = idx;
      if ((z.kind === 'pick' || z.kind === 'scale' || z.kind === 'choice') && String(state.answers[s.col]) === String(z.value)) b.classList.add('sel');
      layer.appendChild(b);
    }
  });

  if (s.blocks) s.blocks.forEach(b => layer.appendChild(blockEl(b)));
  if (s.labelsBy) zonesOf(s).forEach((z, i) => layer.appendChild(plabel(s, z, i)));
  if (s.scale) layer.appendChild(scaleEl(s.scale, true));
  if (s.consent) layer.appendChild(consentEl());

  $screen.replaceChildren(layer);
  $back.classList.toggle('show', state.i > 0);
  refreshNext();
}

// 스모어 버튼 — '다음'은 '>' 아이콘 + 글자(필수 입력이 비어 있으면 스모어처럼 반투명 비활성), 선택지는 글자만(rect 위치)
function smoreBtn(z, idx) {
  const b = document.createElement('button');
  b.className = 'hot smore-btn' + (z.kind === 'next' ? ' next' : ' choice'); b.type = 'button'; b.dataset.idx = idx;
  if (z.rect) b.style.cssText = css(z.rect);
  if (z.cy) b.style.top = `calc(${z.cy}% - var(--u) * 18)`;   // 미니멀 '다음' 버튼의 세로 중심 위치 바꾸기
  if (z.w) { b.style.width = `calc(var(--u) * ${z.w})`; b.style.left = `calc(50% - var(--u) * ${z.w / 2})`; }   // 가로 폭만 바꾸기
  b.innerHTML = z.kind === 'next'
    ? `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg><span>${z.text}</span>`
    : `<span>${z.value}</span>`;
  if (z.require && !z.require.every(filled)) b.classList.add('disabled');
  return b;
}
function refreshNext() {
  const b = $screen.querySelector('.layer .smore-btn'); if (!b) return;
  const z = zonesOf(STEPS[state.i])[+b.dataset.idx];
  b.classList.toggle('disabled', !!(z.require && !z.require.every(filled)));
}

// HTML 블록(좌표는 폰 390×650px 기준 px)
function blockEl(b) {
  const d = document.createElement('div'); d.className = 'blk';
  const [x, y, w, h] = b.box;
  d.style.cssText = `left:calc(var(--u)*${x});top:calc(var(--u)*${y});width:calc(var(--u)*${w});height:calc(var(--u)*${h})`;
  d.innerHTML = b.html; return d;
}

// 사진 아래 이름 (위치: 사진 가운데, 그 줄 사진 아래 끝 + 10px). box를 주면 그 조각 안 좌표로
function plabel(s, z, i, box) {
  const d = document.createElement('div'); d.className = 'plabel'; d.textContent = z.value;
  let cx = z.rect[0] + z.rect[2] / 2, bot = s.labelsBy(state.answers)[Math.floor(i / 2)];
  if (box) { const [x0, y0, x1, y1] = box; cx = (cx - x0) / (x1 - x0) * 100; bot = (bot - y0) / (y1 - y0) * 100; }
  d.style.left = cx + '%'; d.style.top = `calc(${bot}% + var(--sw) * 10 / 390)`;
  return d;
}

const filled = c => { const v = state.answers[c]; return v !== undefined && v !== null && String(v).trim() !== ''; };

/* 스모어 0~10 숫자 버튼 동작 (FormScaleNumberButton 그대로) — 누르면 선택(살짝 떠오르며 1.1배), 같은 숫자를 다시 누르면 선택 해제 */
function scaleEl(sc, live) {
  const el = document.createElement('div'); el.className = 'scale-pc';
  el.style.cssText = css(sc.rect);
  const nums = document.createElement('div'); nums.className = 'nums';
  for (let n = sc.from; n <= sc.to; n++) {
    const b = document.createElement('div'); b.className = 'snum'; b.textContent = n; b.dataset.n = n;
    if (filled(sc.col) && +state.answers[sc.col] === n) b.classList.add('selected');
    nums.appendChild(b);
  }
  el.appendChild(nums);
  el.insertAdjacentHTML('beforeend', `<div class="labels"><span class="l">${sc.left}</span><span class="r">${sc.right}</span></div>`);
  if (live) nums.addEventListener('click', e => {
    const b = e.target.closest('.snum'); if (!b || state.busy) return;
    const n = +b.dataset.n, same = filled(sc.col) && +state.answers[sc.col] === n;
    if (same) delete state.answers[sc.col]; else state.answers[sc.col] = n;
    nums.querySelectorAll('.snum').forEach(x => x.classList.toggle('selected', !same && x === b));
    track('answer', { col: sc.col, answer: same ? '' : n });
    refreshNext();
  });
  return el;
}

function consentEl() {
  const c = document.createElement('div');
  c.className = 'consent';
  c.innerHTML = `<button class="box${state.consent ? ' on' : ''}" type="button" aria-label="동의"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><label><span class="policy-link">개인정보처리방침</span>을 확인하였으며 이에 동의합니다.</label>`;
  return c;
}

  'bg': [],   // HTML로만 구성된 페이지(프로세스) — 이미지 조각 없음
  'p-2b': [{r:[33.8,23.7,68.4,29.1]}, {r:[9.6,32.2,45.7,65],z:0}, {r:[53.3,32.2,89.3,65],z:1}],
  'p-3x': [{r:[23.8,10.4,76,13.5]}, {r:[9.6,20,45.6,44.2],z:0}, {r:[54.2,20,90.2,44.2],z:1}, {r:[9.6,45.4,45.6,69.6],z:2}, {r:[54.2,45.4,90.2,69.6],z:3}, {r:[9.6,70.8,45.6,95],z:4}, {r:[54.2,70.8,90.2,95],z:5}],
  'p-4x': [{r:[23.8,10.4,76,13.5]}, {r:[9.6,20,45.6,44.2],z:0}, {r:[54.2,20,90.2,44.2],z:1}, {r:[9.6,45.4,45.6,69.6],z:2}, {r:[54.2,45.4,90.2,69.6],z:3}, {r:[9.6,70.8,45.6,95],z:4}, {r:[54.2,70.8,90.2,95],z:5}],
  'p-5n': [{r:[9.63,16.11,90.37,37.78]}, {r:[13.06,43.56,86.76,46.89]}],
  'p-6n': [{r:[15.2,11.8,84.8,61.1]}, {r:[20.6,65.3,79.3,68.3]}],
  'p-7q': [{r:[17.87,40.89,77.31,46.28]}],
  'p-8q': [{r:[25.74,40.89,76.57,46.28]}],
  'p-9q': [{r:[16.48,40.94,84.72,46.28]}],
};
const EASE = 'cubic-bezier(.19,1,.22,1)';          // 스모어 질문 전환 곡선
const EASE_OUT = 'cubic-bezier(.165,.84,.44,1)';   // 스모어 카드 퇴장 곡선
const $plate = document.getElementById('plate');
const MOTION = !matchMedia('(prefers-reduced-motion: reduce)').matches && typeof Element.prototype.animate === 'function'
  && (CSS.supports('mask-image', 'url("a.png")') || CSS.supports('-webkit-mask-image', 'url("a.png")'));
const keyOf = src => src.replace(/^pages\//, '').replace(/\.jpg$/, '');
const maskOf = src => `pages/m-${keyOf(src)}.png`;
const wait = ms => new Promise(r => setTimeout(r, ms));
const anim = (el, frames, opt) => el.animate(frames, { fill: 'both', ...opt }).finished.catch(() => {});
const stopAnims = el => el.getAnimations().forEach(a => a.cancel());

// 이미지 미리 받아 디코드 — 전환 중 빈 화면·깜빡임 방지
const loaded = {};
function load(src) {
  return loaded[src] || (loaded[src] = new Promise(res => {
    const im = new Image();
    im.onload = () => (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(res);
    im.onerror = res;
    im.src = src;
  }));
}
const ready = s => Promise.race([Promise.all([load(imgOf(s)), FX_PIECES[keyOf(imgOf(s))].length ? load(maskOf(imgOf(s))) : null, load('pages/bg.jpg'),
  ...(s.blocks ? ['proc-s1a', 'proc-s1b', 'proc-s2a', 'proc-s2b'].map(k => load(`pages/${k}.jpg`)) : [])]), wait(2000)]);

// 현재 답변 상태(선택 테두리·입력한 글자 포함)로 페이지를 조각으로 만듦
function buildFx(s) {
  const src = imgOf(s), zones = zonesOf(s);
  const root = document.createElement('div'); root.className = 'fx';
  const pieces = [];
  FX_PIECES[keyOf(src)].forEach(p => {
    const [x0, y0, x1, y1] = p.r, w = x1 - x0, h = y1 - y0;
    const local = r => `left:${(r[0] - x0) / w * 100}%;top:${(r[1] - y0) / h * 100}%;width:${r[2] / w * 100}%;height:${r[3] / h * 100}%`;
    const el = document.createElement('div'); el.className = 'piece';
    el.style.cssText = `left:${x0}%;top:${y0}%;width:${w}%;height:${h}%`;
    const inner = document.createElement('div'); inner.className = 'pc-in';
    inner.style.cssText = `left:${-x0 / w * 100}%;top:${-y0 / h * 100}%;width:${10000 / w}%;height:${10000 / h}%;`
      + `background-image:url("${src}");-webkit-mask-image:url("${maskOf(src)}");mask-image:url("${maskOf(src)}")`;
    el.appendChild(inner);
    const z = p.z != null ? zones[p.z] : null;
    if (z && s.labelsBy) el.appendChild(plabel(s, z, p.z, p.r));   // 이름도 사진 조각과 함께 움직임
    if (z && z.kind === 'field' && state.answers[z.col]) {
      const f = document.createElement('div'); f.className = 'field fake' + (z.align === 'left' ? ' left' : '');
      f.textContent = state.answers[z.col];
      f.style.cssText = local(z.rect) + `;background:${z.fill};color:${z.ink};font-size:clamp(13px,4.4vw,20px)`;
      el.appendChild(f);
    }
    root.appendChild(el);
    pieces.push({ el, z: p.z, kind: z && z.kind, top: y0, s: 1, o: 1 });
  });
  if (s.blocks) s.blocks.forEach(b => { const c = blockEl(b); root.appendChild(c); pieces.push({ el: c, top: b.box[1] / 6.5, s: 1, o: 1 }); });
  if (s.scale) { const c = scaleEl(s.scale, false); root.appendChild(c); pieces.push({ el: c, top: s.scale.rect[1], s: 1, o: 1 }); }
  zones.forEach(z => { if (z.kind === 'field' && z.glass) {   // 유리 입력칸(입력한 글자 또는 안내 글씨 그대로)
    const v = state.answers[z.col], f = document.createElement('div');
    f.className = 'field glass fake' + (v ? '' : ' empty'); f.textContent = v || z.ph || ''; f.style.cssText = css(z.rect);
    root.appendChild(f); pieces.push({ el: f, top: z.rect[1], s: 1, o: 1 });
  } });
  zones.forEach((z, idx) => { if (z.smore) { const b = smoreBtn(z, idx); root.appendChild(b); pieces.push({ el: b, z: idx, kind: z.kind, top: z.rect ? z.rect[1] : 84, s: 1, o: 1 }); } });
  if (s.consent) { const c = consentEl(); root.appendChild(c); pieces.push({ el: c, top: 90.7, s: 1, o: 1 }); }
  // 같은 줄(윗변 차이 1.5% 이내)은 같은 순번 → 스모어처럼 위에서부터 줄 단위로 차례차례
  let order = -1, last = -99;
  pieces.slice().sort((a, b) => a.top - b.top).forEach(p => { if (p.top - last > 1.5) { order++; last = p.top; } p.order = order; });
  return { root, pieces };
}

// 고른 순간 반응 (스모어와 같은 값)
async function feedback(fx, idx) {
  const hit = fx.pieces.find(p => p.z === idx);
  if (!hit) return;
  if (hit.kind === 'next') {
    hit.s = 1.04;
    await anim(hit.el, [{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }], { duration: 200, easing: 'ease' });
    return;
  }
  const others = fx.pieces.filter(p => p !== hit && (p.kind === 'pick' || p.kind === 'choice' || p.kind === 'scale'));
  hit.s = 1.04; others.forEach(p => { p.s = .96; p.o = .7; });
  await Promise.all([
    anim(hit.el, [{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }], { duration: 180, easing: 'ease' }),
    ...others.map(p => anim(p.el, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.96)', opacity: .7 }], { duration: 180, easing: 'ease' })),
  ]);
}
const playOut = (fx, start) => Promise.all(fx.pieces.map(p => { stopAnims(p.el);
  if (start) {   // 스모어 첫 화면 퇴장: 왼쪽으로 화면 폭만큼 밀리며 0.7배·투명 (0.08초 간격, 0.4초)
    const w = $screen.getBoundingClientRect().width;
    return anim(p.el, [{ transform: `scale(${p.s})`, opacity: p.o }, { transform: `translateX(${-w}px) scale(.7)`, opacity: 0 }], { duration: 400, delay: 80 * p.order, easing: 'ease' });
  }
  return anim(p.el, [{ transform: `scale(${p.s})`, opacity: p.o }, { transform: 'scale(.1)', opacity: 0 }], { duration: 800, delay: 70 * p.order, easing: EASE }); }));
const playIn = (fx, base) => Promise.all(fx.pieces.map(p =>
  anim(p.el, [{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 800, delay: base + 95 * p.order, easing: EASE })));

let popSeq = 0;
async function transition(to, dir, idx) {
  popSeq++;
  state.busy = true; $back.classList.remove('show');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (!MOTION) { state.i = to; render(); track('view', { dir }); state.busy = false; return; }
  const readyNext = ready(STEPS[to]);
  const out = buildFx(STEPS[state.i]);
  $screen.replaceChildren(out.root);                 // 원본 → 조각 (보이는 모습 동일)
  if (idx != null) { await feedback(out, idx); await wait(180); }
  const fromStart = STEPS[state.i].id === 'intro';
  state.i = to; track('view', { dir });
  const t0 = performance.now();
  const outDone = playOut(out, fromStart);
  await readyNext;
  const inn = buildFx(STEPS[to]);
  $screen.appendChild(inn.root);
  await Promise.all([outDone, playIn(inn, Math.max(0, 420 - (performance.now() - t0)))]);
  render();                                          // 조각 → 원본 (보이는 모습 동일)
  state.busy = false;
}

// 다음으로 넘어가지 않는 선택(성별·무드 숫자)은 제자리에서 톡 튀는 반응만
async function popSelect(idx) {
  if (!MOTION) return;
  const id = ++popSeq, fx = buildFx(STEPS[state.i]);
  const hit = fx.pieces.find(p => p.z === idx); if (!hit) return;
  $screen.replaceChildren(fx.root);
  const up = hit.kind === 'scale' ? 'translateY(-3px) scale(1.1)' : 'scale(1.04)';   // 스모어 숫자 버튼·선택지 값
  await anim(hit.el, [{ transform: 'none' }, { transform: up, offset: .4 }, { transform: 'none' }], { duration: 420, easing: 'ease' });
  if (id === popSeq && !state.busy) render();
}

function next(idx) { if (STEPS[state.i + 1]) transition(state.i + 1, 'next', idx); else finish(idx); }

async function finish(idx) {
  state.busy = true; state.submitted = true; popSeq++;
  track('submit', { answers: { ...state.answers }, consent: state.consent });
  try { sessionStorage.removeItem(SID_KEY); } catch (e) {}
  $back.classList.remove('show');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (MOTION) {
    const out = buildFx(STEPS[state.i]);
    $screen.replaceChildren(out.root);
    if (idx != null) { await feedback(out, idx); await wait(180); }
    playOut(out);
    await wait(450);
    $loading.classList.add('show');
    await anim($loading, [{ opacity: 0 }, { opacity: 1 }], { duration: 600, easing: 'ease' });   // 스모어 로딩 페이지
  } else $loading.classList.add('show');
  await wait(CONFIG.LOADING_MS);
  $done.classList.add('show');
  if (MOTION) {
    load('pages/done-48.jpg');
    await Promise.all([   // 스모어 결과 화면: 아래에서 밀려 올라오고, 로딩 화면은 뒤로 작아짐
      anim($done, [{ transform: 'translate3d(0,100%,0)' }, { transform: 'none' }], { duration: 1100, delay: 100, easing: EASE }),
      anim($loading, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.75)', opacity: .8 }], { duration: 1000, easing: EASE_OUT }),
    ]);
  }
  $loading.classList.remove('show');
  state.busy = false;
}

/* 클릭 처리 */
$screen.addEventListener('click', e => {
  if (state.busy) return;
  // 개인정보처리방침 링크 → 팝업
  if (e.target.closest('.policy-link')) { openModal(); return; }
  // 동의 체크박스 (박스/라벨 클릭 시 토글)
  const consentEl = e.target.closest('.consent');
  if (consentEl) {
    state.consent = !state.consent;
    consentEl.querySelector('.box').classList.toggle('on', state.consent);
    consentEl.classList.remove('warn');
    return;
  }

  const b = e.target.closest('.hot');
  if (!b) return;
  const s = STEPS[state.i];
  const z = zonesOf(s)[+b.dataset.idx];

  if (z.kind === 'next') {
    if (z.require && !z.require.every(filled)) {
      const empty = z.require.find(c => !filled(c));
      const f = $screen.querySelector(`.field[data-col="${empty}"]`); if (f) f.focus();
      const card = $screen.querySelector('.layer .scale-pc');
      if (card && s.scale && s.scale.col === empty && MOTION)   // 스모어 shake 300ms
        card.animate([{ transform: 'none' }, { transform: 'translateX(-4px)', offset: .1 }, { transform: 'translateX(4px)', offset: .2 }, { transform: 'translateX(-4px)', offset: .3 },
          { transform: 'translateX(4px)', offset: .4 }, { transform: 'translateX(-4px)', offset: .5 }, { transform: 'translateX(4px)', offset: .6 }, { transform: 'translateX(-4px)', offset: .7 },
          { transform: 'translateX(2px)', offset: .8 }, { transform: 'translateX(-2px)', offset: .9 }, { transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.455,.03,.515,.955)' });
      return;
    }
    if (z.consent && !state.consent) {
      const ce = $screen.querySelector('.consent');
      if (ce) { ce.classList.remove('warn'); void ce.offsetWidth; ce.classList.add('warn'); }
      return;
    }
    if (z.submit) finish(+b.dataset.idx); else next(+b.dataset.idx);
    return;
  }
  if (z.kind === 'pick' || z.kind === 'scale' || z.kind === 'choice') {
    state.answers[s.col] = z.value;
    track('answer', { col: s.col, answer: z.value });
    $screen.querySelectorAll('.hot').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    if (z.auto || z.kind === 'choice') next(+b.dataset.idx); else popSelect(+b.dataset.idx);
  }
});

/* 입력 처리 — 글자 있으면 원본 자리표시자 덮기 */
// 010-XXXX-XXXX 자동 하이픈
function fmtPhone(v, del) {
  const d = v.replace(/\D/g, '').slice(0, 11);
  let r = d.slice(0, 3);
  if (d.length > 3) r += '-' + d.slice(3, 7);
  if (d.length > 7) r += '-' + d.slice(7, 11);
  if (!del) { // 입력 중일 때만 그룹이 꽉 차면 다음 '-'를 미리 표시
    if (d.length === 3) r += '-';        // 010-
    else if (d.length === 7) r += '-';   // 010-1234-
  }
  return r;
}
$screen.addEventListener('input', e => {
  const f = e.target.closest('.field'); if (!f) return;
  if (f.dataset.format === 'phone') {
    const del = e.inputType && e.inputType.indexOf('delete') === 0;
    f.value = fmtPhone(f.value, del);
  }
  state.answers[f.dataset.col] = f.value;
  if (f.dataset.fill) f.style.background = f.value.length ? f.dataset.fill : 'transparent';
  refreshNext();
});
// 칸을 누르면(커서 깜빡일 때) 원본 예시 글씨를 즉시 가림
$screen.addEventListener('focusin', e => {
  const f = e.target.closest('.field'); if (!f) return;
  if (f.dataset.fill) f.style.background = f.dataset.fill;
  // 연락처 칸: 누르면 '010-' 자동 표시
  if (f.dataset.format === 'phone' && !f.value) {
    f.value = '010-';
    state.answers[f.dataset.col] = f.value;
  }
});
// 비어있는 채로 벗어나면 다시 예시 글씨가 보이도록
$screen.addEventListener('focusout', e => {
  const f = e.target.closest('.field'); if (!f) return;
  // 연락처를 '010-'만 남기고 안 채웠으면 비움(빈칸 처리)
  if (f.dataset.format === 'phone' && f.value.replace(/\D/g, '').length <= 3) {
    f.value = '';
    state.answers[f.dataset.col] = '';
  }
  if (f.dataset.fill) f.style.background = f.value.length ? f.dataset.fill : 'transparent';
  refreshNext();
});
$screen.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.closest('.field')) return;
  e.preventDefault();
  const fields = [...$screen.querySelectorAll('.field')];
  const idx = fields.indexOf(e.target);
  if (idx < fields.length - 1) fields[idx + 1].focus(); else e.target.blur();
});

$back.addEventListener('click', () => { if (!state.busy && state.i > 0) transition(state.i - 1, 'back'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && !state.submitted) track('leave'); });

/* 개인정보처리방침 팝업 */
const $modal = document.getElementById('modal');
document.getElementById('policyBody').textContent = POLICY;
// 스모어 약관 카드: 어두운 배경 0.4초 페이드 + 카드가 아래에서 0.9초 동안 올라옴 / 닫을 땐 아래로 내려감
const $card = $modal.querySelector('.card');
let modalClosing = false;
function openModal() {
  if ($modal.classList.contains('show')) return;
  $modal.classList.add('show'); track('policy_open');
  if (!MOTION) return;
  anim($modal, [{ backgroundColor: 'rgba(0,0,0,0)' }, { backgroundColor: 'rgba(0,0,0,.62)' }], { duration: 400, easing: 'ease' });
  anim($card, [{ transform: 'translate3d(0,800px,0)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 900, easing: EASE });
}
async function closeModal() {
  if (modalClosing || !$modal.classList.contains('show')) return;
  if (MOTION) {
    modalClosing = true;
    await Promise.all([
      anim($modal, [{ backgroundColor: 'rgba(0,0,0,.62)' }, { backgroundColor: 'rgba(0,0,0,0)' }], { duration: 400, easing: 'ease' }),
      anim($card, [{ transform: 'none', opacity: 1 }, { opacity: 0, offset: .4 }, { transform: 'translate3d(0,800px,0)', opacity: 0 }], { duration: 900, easing: EASE_OUT }),
    ]);
    stopAnims($modal); stopAnims($card); modalClosing = false;
  }
  $modal.classList.remove('show');
}
document.getElementById('policyClose').addEventListener('click', closeModal);
$modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $modal.classList.contains('show')) closeModal(); });

/* 시작 — 스모어 첫 화면처럼 배경이 0.8초 페이드인, 요소들이 아래에서 차례로 떠오름(0.15초 간격, 1.2초) */
async function start() {
  track('view', { dir: 'start' });
  if (!MOTION) { $plate.style.opacity = 1; render(); return; }
  state.busy = true;
  await ready(STEPS[0]);
  const fx = buildFx(STEPS[0]);
  $screen.replaceChildren(fx.root);
  const rise = $screen.getBoundingClientRect().width * 100 / 390;   // 스모어 100px(폰 폭 기준)
  anim($plate, [{ opacity: 0 }, { opacity: 1 }], { duration: 800, easing: 'ease' });
  await Promise.all(fx.pieces.map(p => anim(p.el, [{ transform: `translate3d(0,${rise}px,0)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
    { duration: 1200, delay: 150 * p.order, easing: 'cubic-bezier(.075,.82,.165,1)' })));
  render();
  state.busy = false;
}
start();
// 나머지 페이지·조각 마스크 미리 받기
['p-1n','p-2b','p-3x','p-4x','p-5n','p-6n','p-7q','p-8q','p-9q'].forEach(k => { load(`pages/${k}.jpg`); load(`pages/m-${k}.png`); });
load('pages/done-48.jpg');
['proc-s1a','proc-s1b','proc-s2a','proc-s2b'].forEach(k => load(`pages/${k}.jpg`));
</script>
</body>
